name: keep-alive
on:
  schedule:
    - cron: '0 6 * * *'     # SETIAP HARI jam 06:00 UTC (13:00 WIB)
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      URL: ${{ secrets.SUPABASE_URL }}
      KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - name: Insert ke tabel ping
        run: |
          curl -sS -f -X POST "$URL/rest/v1/ping" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
      - name: Baca tabel warga (aktivitas nyata)
        run: |
          curl -sS -f "$URL/rest/v1/warga?select=id&limit=1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY"